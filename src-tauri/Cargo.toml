[package]
name = "customchrome"
version = "0.1.0"
description = "Offline control app for the AULA F99 MAX keyboard"
edition = "2021"

[lib]
name = "customchrome_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
hidapi = "2.6"
thiserror = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
